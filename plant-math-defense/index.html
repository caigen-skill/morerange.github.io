<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="给一年级小朋友玩的植物守卫数学小游戏，挑战 20 以内加减法。"
    />
    <meta name="theme-color" content="#173f2a" />
    <title>植物守卫：数学大作战</title>
    <style>
:root{--ink: #163524;--deep: #173f2a;--green: #2f8f4e;--lime: #9bd536;--yellow: #ffd652;--orange: #f49a35;--cream: #fff9df;--sky: #87d8ee;--white: #ffffff;--danger: #e85540;--shadow: rgba(25, 85, 45, .22);--radius: 24px}*{box-sizing:border-box}html{min-height:100%;background:var(--sky)}body{min-width:320px;min-height:100dvh;margin:0;overflow-x:hidden;color:var(--ink);font-family:Arial Rounded MT Bold,PingFang SC,Microsoft YaHei,system-ui,sans-serif;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 38%),linear-gradient(180deg,var(--sky) 0 65%,#78bf4a 65% 100%)}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:translateY(2px) scale(.98)}button:focus-visible,input:focus-visible{outline:4px solid rgba(255,214,82,.95);outline-offset:3px}.hidden{display:none!important}.sky-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}.sun{position:absolute;top:7vh;right:7vw;width:118px;height:118px;border-radius:50%;background:#ffe674;box-shadow:0 0 0 20px #ffe6742e}.cloud{position:absolute;width:140px;height:42px;border-radius:999px;background:#ffffffc2}.cloud:before,.cloud:after{position:absolute;bottom:0;content:"";border-radius:50%;background:inherit}.cloud:before{left:24px;width:66px;height:66px}.cloud:after{right:20px;width:52px;height:52px}.cloud-a{top:12%;left:4%}.cloud-b{top:26%;right:16%;transform:scale(.72)}.game-shell{position:relative;z-index:1;width:min(1180px,calc(100% - 32px));min-height:100dvh;margin:0 auto;padding:22px 0 32px}.topbar{display:flex;align-items:center;justify-content:space-between;min-height:64px}.brand{display:inline-flex;gap:10px;align-items:center;color:var(--deep);text-decoration:none}.brand-mark{display:grid;width:48px;height:48px;place-items:center;border:3px solid var(--deep);border-radius:16px;background:var(--yellow);font-size:28px;box-shadow:0 5px 0 var(--deep)}.brand strong,.brand small{display:block}.brand strong{font-size:20px;line-height:1}.brand small{margin-top:4px;font-size:12px;font-weight:800;letter-spacing:.12em}.top-actions{display:flex;gap:10px}.icon-button,.small-button{min-height:46px;border:3px solid var(--deep);color:var(--deep);background:#ffffffe6;box-shadow:0 5px 0 var(--deep)}.icon-button{display:grid;width:48px;padding:0;place-items:center;border-radius:15px;font-size:21px}.small-button{padding:0 18px;border-radius:15px;font-weight:900}.screen{min-height:calc(100dvh - 118px)}.welcome-screen{display:grid;grid-template-columns:minmax(0,.92fr) minmax(420px,1.08fr);gap:32px;align-items:center;padding:3vh 0 7vh}.welcome-copy{position:relative;z-index:2}.eyebrow{margin:0 0 12px;color:var(--deep);font-size:13px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}h1{max-width:700px;margin:0;font-size:clamp(46px,6.1vw,84px);line-height:.98;letter-spacing:-.06em}h1 em{display:inline-block;padding-bottom:7px;color:#fff8c9;font-style:normal;text-shadow:0 4px 0 var(--deep),3px 0 0 var(--deep),-3px 0 0 var(--deep),0 -3px 0 var(--deep)}.intro{max-width:520px;margin:24px 0 28px;font-size:18px;font-weight:700;line-height:1.65}.start-form label{display:block;margin-bottom:9px;font-size:15px;font-weight:900}.name-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;max-width:540px}.name-row input{min-width:0;height:60px;padding:0 20px;border:3px solid var(--deep);border-radius:18px;color:var(--deep);background:var(--white);box-shadow:0 6px #173f2a38;font-size:18px;font-weight:800}.name-row input::placeholder{color:#70877a}.primary-button,.secondary-button{min-height:60px;padding:0 28px;border:3px solid var(--deep);border-radius:18px;font-weight:950;white-space:nowrap}.primary-button{color:var(--deep);background:var(--yellow);box-shadow:0 7px 0 var(--deep)}.secondary-button{color:var(--deep);background:var(--white);box-shadow:0 7px 0 var(--deep)}.form-error{min-height:22px;margin:8px 0 0;color:#8c1f15;font-size:14px;font-weight:800}.quick-rules{display:flex;gap:20px;margin-top:24px;font-size:13px;font-weight:900}.quick-rules span{display:inline-flex;gap:7px;align-items:center}.quick-rules b{display:grid;width:25px;height:25px;place-items:center;border:2px solid var(--deep);border-radius:8px;background:var(--white)}.welcome-art{position:relative;min-height:520px;border:4px solid var(--deep);border-radius:48% 52% 28% 34%/45% 40% 28% 35%;background:radial-gradient(circle at 60% 28%,rgba(255,255,255,.72) 0 4%,transparent 4.5%),linear-gradient(180deg,#b8ebf3 0 65%,#71b53f 65% 100%);box-shadow:16px 18px #173f2a2e,inset 0 -20px #236e3138;overflow:hidden}.grass-platform{position:absolute;right:-4%;bottom:4%;left:-4%;height:26%;border-top:4px solid var(--deep);background:linear-gradient(135deg,transparent 75%,rgba(255,255,255,.1) 75%) 0 0 / 44px 44px,#75bd43}.plant-character{position:absolute;bottom:18%;left:12%;z-index:2;width:190px;height:260px;transform:rotate(-4deg);animation:plantBob 2.2s ease-in-out infinite}.plant-head{position:absolute;top:0;left:10px;width:160px;height:140px;border:5px solid var(--deep);border-radius:50% 48% 45% 52%;background:#7fd33f;box-shadow:inset -18px -10px #20703038}.plant-nose{position:absolute;top:44px;right:-43px;width:76px;height:62px;border:5px solid var(--deep);border-left:0;border-radius:15px 55% 55% 15px;background:#75c93a}.plant-nose:after{position:absolute;top:13px;right:12px;width:22px;height:22px;content:"";border:4px solid var(--deep);border-radius:50%;background:#315d2e}.plant-eye{position:absolute;top:28px;z-index:2;width:18px;height:27px;border-radius:50%;background:var(--deep)}.plant-eye.left{left:45px}.plant-eye.right{left:86px}.plant-eye:after{position:absolute;top:3px;left:4px;width:6px;height:8px;content:"";border-radius:50%;background:var(--white)}.plant-mouth{position:absolute;bottom:25px;left:55px;width:44px;height:18px;border-bottom:5px solid var(--deep);border-radius:50%}.plant-stem{position:absolute;bottom:8px;left:76px;width:30px;height:130px;border:5px solid var(--deep);border-radius: 4px solid var(--deep);border-radius:var(--radius);background:var(--cream);box-shadow:0 8px #173f2a3d}.question-meta{display:flex;justify-content:space-between;font-size:12px;font-weight:900}.question-meta span:last-child{padding:4px 10px;border-radius:999px;color:var(--white);background:var(--green)}.question-text{margin:4px 0 12px;text-align:center;font-size:clamp(38px,6vw,62px);font-weight:950;letter-spacing:.02em}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.answer-button{min-height:68px;border:3px solid var(--deep);border-radius:18px;color:var(--deep);background:var(--white);box-shadow:0 6px 0 var(--deep);font-size:clamp(24px,4vw,36px);font-weight:950}.answer-button:hover{background:#f0ffd2}.answer-button.correct{background:var(--lime)}.answer-button.wrong{color:var(--white);background:var(--danger)}.answer-button:disabled{cursor:default}.result-screen{display:grid;place-items:center;padding:28px 0}.result-card{width:min(570px,100%);padding:34px;border:4px solid var(--deep);border-radius:32px;text-align:center;background:var(--cream);box-shadow:14px 16px #173f2a3d}.result-badge{display:grid;width:92px;height:92px;margin:-10px auto 18px;place-items:center;border:4px solid var(--deep);border-radius:28px;background:var(--yellow);box-shadow:0 7px 0 var(--deep);font-size:48px;transform:rotate(-5deg)}.result-card h2,.rank-dialog h2{margin:0;font-size:clamp(36px,7vw,54px);line-height:1;letter-spacing:-.04em}.result-message{margin:14px auto 22px;font-weight:800;line-height:1.6}.result-score{display:flex;align-items:baseline;justify-content:center;gap:12px;margin:10px 0 22px}.result-score span{font-size:14px;font-weight:900}.result-score strong{color:var(--green);font-size:72px;line-height:1}.result-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 26px;border-block:2px dashed rgba(23,63,42,.28)}.result-stats div{padding:16px 6px}.result-stats div+div{border-left:2px dashed rgba(23,63,42,.28)}.result-stats strong,.result-stats span{display:block}.result-stats strong{font-size:27px}.result-stats span{margin-top:4px;font-size:12px;font-weight:900}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rank-dialog{width:min(520px,calc(100% - 28px));max-height:min(720px,calc(100dvh - 28px));padding:28px;border:4px solid var(--deep);border-radius:28px;color:var(--deep);background:var(--cream);box-shadow:14px 16px #173f2a47}.rank-dialog::backdrop{background:#0a2c1b99;backdrop-filter:blur(4px)}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}.close-button{font-size:28px;font-weight:900}.rank-list{display:grid;gap:9px;margin:0;padding:0;list-style:none;counter-reset:rank}.rank-list li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;min-height:56px;padding:8px 14px 8px 8px;border:2px solid rgba(23,63,42,.2);border-radius:16px;background:var(--white);counter-increment:rank}.rank-list li:before{display:grid;width:38px;height:38px;place-items:center;border-radius:12px;content:counter(rank);color:var(--white);background:var(--green);font-weight:950}.rank-list li:nth-child(1):before{color:var(--deep);background:var(--yellow)}.rank-list li:nth-child(2):before{color:var(--deep);background:#dce6df}.rank-list li:nth-child(3):before{color:var(--white);background:var(--orange)}.rank-name{min-width:0;overflow:hidden;font-weight:900;text-overflow:ellipsis;white-space:nowrap}.rank-score{font-size:20px;font-weight:950}.rank-empty{padding:34px 10px;text-align:center;font-weight:800}.rank-note{margin:16px 0 0;color:#536d5c;text-align:center;font-size:12px;font-weight:700}.toast{position:fixed;right:50%;bottom:max(22px,env(safe-area-inset-bottom));z-index:20;max-width:calc(100% - 30px);padding:12px 20px;border:3px solid var(--deep);border-radius:16px;color:var(--deep);background:var(--yellow);box-shadow:0 6px 0 var(--deep);font-weight:900;opacity:0;pointer-events:none;transform:translate(50%,20px);transition:.25s ease}.toast.show{opacity:1;transform:translate(50%)}@keyframes plantBob{0%,to{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(0) translateY(-10px)}}@keyframes zombieShuffle{0%,to{transform:rotate(6deg) translate(0)}50%{transform:rotate(2deg) translate(-12px)}}@keyframes peaFly{0%{transform:translate(-25px)}to{transform:translate(130px)}}@media(max-width:850px){.game-shell{width:min(100% - 24px,700px);padding-top:12px}.welcome-screen{grid-template-columns:1fr;padding-top:34px}.welcome-copy{text-align:center}.intro,.name-row{margin-right:auto;margin-left:auto}.start-form label{text-align:left}.quick-rules{justify-content:center}.welcome-art{min-height:430px}.plant-character{left:14%;transform:scale(.85);transform-origin:bottom left}.zombie-character{right:10%;transform:scale(.85);transform-origin:bottom right}}@media(max-width:620px){body{background:linear-gradient(180deg,var(--sky) 0 72%,#78bf4a 72% 100%)}.topbar{min-height:56px}.brand-mark{width:42px;height:42px;border-radius:13px;font-size:24px}.brand strong{font-size:17px}.brand small{display:none}.small-button{width:48px;padding:0;overflow:hidden;color:transparent;white-space:nowrap}.small-button:first-letter{color:var(--deep)}.screen{min-height:calc(100dvh - 76px)}.welcome-screen{gap:26px;padding:28px 0 40px}h1{font-size:clamp(43px,13vw,62px)}.intro{margin:18px auto 22px;font-size:15px}.name-row{grid-template-columns:1fr}.primary-button,.secondary-button,.name-row input{width:100%;min-height:56px}.quick-rules{gap:9px;font-size:11px}.quick-rules span{gap:4px}.welcome-art{min-height:350px;border-radius:34% 42% 22% 25%/30% 35% 20% 24%}.plant-character{left:4%;bottom:14%;transform:scale(.67)}.zombie-character{right:3%;bottom:14%;transform:scale(.67)}.flying-pea{top:50%}.art-score-card{top:6%;right:5%}.game-screen{grid-template-rows:auto minmax(210px,1fr) auto;padding-top:9px}.hud{grid-template-columns:1fr 1fr}.timer-wrap{grid-column:1 / -1}.battlefield{min-height:210px}.question-panel{padding:12px 12px 17px}.question-text{margin:2px 0 9px;font-size:42px}.answers{grid-template-columns:1fr 1fr}.answer-button{min-height:56px;font-size:28px}.result-card{padding:28px 18px;border-radius:26px}.result-score strong{font-size:60px}.result-actions{grid-template-columns:1fr}}@media(max-height:720px)and (min-width:700px){.game-screen{grid-template-rows:auto minmax(200px,1fr) auto}.question-text{font-size:44px}.answer-button{min-height:54px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

  <body>
    <div class="sky-decor" aria-hidden="true">
      <span class="cloud cloud-a"></span>
      <span class="cloud cloud-b"></span>
      <span class="sun"></span>
    </div>

    <main class="game-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="返回游戏首页">
          <span class="brand-mark" aria-hidden="true">🌻</span>
          <span>
            <strong>植物守卫</strong>
            <small>数学大作战</small>
          </span>
        </a>
        <div class="top-actions">
          <button id="soundButton" class="icon-button" type="button" aria-label="关闭声音">
            <span aria-hidden="true">🔊</span>
          </button>
          <button id="rankButton" class="small-button" type="button">🏆 排行榜</button>
        </div>
      </header>

      <section id="welcomeScreen" class="screen welcome-screen" aria-labelledby="gameTitle">
        <div class="welcome-copy">
          <p class="eyebrow">一年级 · 20 以内加减法</p>
          <h1 id="gameTitle">算对一题，<br /><em>发射一颗豌豆！</em></h1>
          <p class="intro">
            60 秒守住草坪。答得越快，连击越高，看看谁能成为数学小英雄。
          </p>

          <form id="startForm" class="start-form">
            <label for="playerName">小勇士叫什么名字？</label>
            <div class="name-row">
              <input
                id="playerName"
                name="playerName"
                type="text"
                maxlength="8"
                autocomplete="nickname"
                placeholder="输入名字"
                required
              />
              <button class="primary-button" type="submit">开始守卫</button>
            </div>
            <p id="nameError" class="form-error" role="alert"></p>
          </form>

          <div class="quick-rules" aria-label="游戏规则">
            <span><b>1</b> 看题目</span>
            <span><b>2</b> 选答案</span>
            <span><b>3</b> 打僵尸</span>
          </div>
        </div>

        <div class="welcome-art" aria-hidden="true">
          <div class="art-score-card">
            <span>最高连击</span>
            <strong>× 10</strong>
          </div>
          <div class="plant-character">
            <div class="plant-head">
              <span class="plant-eye left"></span>
              <span class="plant-eye right"></span>
              <span class="plant-mouth"></span>
              <span class="plant-nose"></span>
            </div>
            <div class="plant-stem"></div>
            <div class="plant-leaf leaf-left"></div>
            <div class="plant-leaf leaf-right"></div>
          </div>
          <div class="zombie-character">
            <div class="zombie-hair"></div>
            <div class="zombie-head">
              <span class="zombie-eye left"></span>
              <span class="zombie-eye right"></span>
              <span class="zombie-mouth"></span>
            </div>
            <div class="zombie-body"></div>
            <div class="zombie-leg leg-left"></div>
            <div class="zombie-leg leg-right"></div>
          </div>
          <span class="flying-pea"></span>
          <div class="grass-platform"></div>
        </div>
      </section>

      <section id="gameScreen" class="screen game-screen hidden" aria-label="游戏进行中">
        <div class="hud">
          <div class="hud-item">
            <span>得分</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="hud-item combo-box">
            <span>连击</span>
            <strong id="comboValue">× 0</strong>
          </div>
          <div class="timer-wrap" aria-label="剩余时间">
            <div class="timer-label">
              <span>倒计时</span>
              <strong id="timeValue">60</strong>
            </div>
            <div class="timer-track"><span id="timerBar"></span></div>
          </div>
        </div>

        <div class="battlefield">
          <canvas id="gameCanvas" aria-label="植物发射豌豆攻击僵尸的动画"></canvas>
          <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
        </div>

        <div class="question-panel">
          <div class="question-meta">
            <span id="questionCount">第 1 题</span>
            <span id="difficultyLabel">热身中</span>
          </div>
          <div id="questionText" class="question-text" aria-live="polite">5 + 3 = ?</div>
          <div id="answers" class="answers" aria-label="请选择答案"></div>
        </div>
      </section>

      <section id="resultScreen" class="screen result-screen hidden" aria-labelledby="resultTitle">
        <div class="result-card">
          <div id="resultBadge" class="result-badge" aria-hidden="true">🏆</div>
          <p class="eyebrow">草坪守住啦</p>
          <h2 id="resultTitle">数学小英雄！</h2>
          <p id="resultMessage" class="result-message"></p>
          <div class="result-score">
            <span>本局得分</span>
            <strong id="finalScore">0</strong>
          </div>
